# Rayon telemetry ingest, for `wrangler dev` and the tests. `cf deploy`
# reads cloudflare.config.ts; keep the two in step. Deploy steps: README.md.
name = "rayon-telemetry"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Served only on its own custom domain: workers.dev is unreliable from
# mainland China and would give the endpoint a second address.
workers_dev = false
preview_urls = false
routes = [{ pattern = "telemetry.kfcv50.today", custom_domain = true }]

# No request logs anywhere: they would hold the IP addresses this Worker never reads.
logpush = false
[observability]
enabled = false
[observability.logs]
enabled = false
invocation_logs = false

# The dashboard's Cloudflare Access application (Zero Trust › Access › Applications). Not secret.
[vars]
ACCESS_TEAM_DOMAIN = "https://djtrump.cloudflareaccess.com"
ACCESS_AUD = "5567c33f0c49b3a426feedb4d3f1f0c790208d322708220b669d3d6d1369051f"

[[d1_databases]]
binding = "DB"
database_name = "rayon-telemetry"
# Created with `cf d1 create --name rayon-telemetry --primary-location-hint apac`.
database_id = "90d72dcf-b4c1-4bb8-8322-5ee7ae53757a"
migrations_dir = "migrations"

[triggers]
# Daily: crash items older than 90 days and stale nonces go.
crons = ["17 3 * * *"]
