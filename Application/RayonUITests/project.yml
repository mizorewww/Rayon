# UI tests for the iOS app. They drive the installed app by bundle
# identifier, so install Rayon on the simulator first; see README.md here.
# Regenerate the project with: xcodegen generate
name: RayonUITests
options:
  bundleIdPrefix: me.mizorewww.rayon
  deploymentTarget:
    iOS: "17.0"
targets:
  RayonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  RayonUITests:
    build:
      targets:
        RayonUITests: [test]
    test:
      targets: [RayonUITests]
