# The Mac app (Rayon) and the iOS app (mRayon).
# Regenerate the project with: xcodegen generate
name: Rayon
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  RayonModule: { path: ../../Foundation/RayonModule }
  RayonTerminal: { path: ../../Foundation/RayonTerminal }
  RayonEditor: { path: ../../Foundation/RayonEditor }
  MachineStatus: { path: ../../Foundation/MachineStatus }
  MachineStatusView: { path: ../../Foundation/MachineStatusView }
  SymbolPicker: { path: ../../Foundation/SymbolPicker }
configFiles:
  Debug: ../../Configuration/Version.xcconfig
  Release: ../../Configuration/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  Rayon:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../../Resources/EULA
        buildPhase: resources
      - path: ../../Resources/LICENSE
        buildPhase: resources
      - path: ../../Resources/Rayon.icon
        buildPhase: resources
        type: folder.iconcomposer
    settings:
      base:
        PRODUCT_NAME: Rayon
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: Rayon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: macOS/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Rayon
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2022 Lakr Aream. Copyright © 2026 mizorewww and Rayon contributors."
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon
    postCompileScripts:
      - name: Record Git Commit
        basedOnDependencyAnalysis: false
        script: |
          commit="$(git -C "$SRCROOT" rev-parse --short=10 HEAD 2>/dev/null || echo unknown)"
          if [ "$commit" != unknown ] && ! git -C "$SRCROOT" diff --quiet HEAD -- 2>/dev/null; then
            commit="$commit-dirty"
          fi
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          rm -f "$out"
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $commit" "$out" >/dev/null
    dependencies:
      - package: RayonModule
      - package: RayonTerminal
      - package: RayonEditor
      - package: MachineStatus
      - package: MachineStatusView
      - package: SymbolPicker
  mRayon:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: ../../Resources/EULA
        buildPhase: resources
      - path: ../../Resources/LICENSE
        buildPhase: resources
      - path: ../../Resources/Rayon.icon
        buildPhase: resources
        type: folder.iconcomposer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mizorewww.rayon
        DEVELOPMENT_TEAM: LT98S43NKA
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: iOS/mRayon.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": iOS/mRayon-iOS.entitlements
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Rayon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Rayon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: We are using Face ID to check your ownership of your devices before performing sensitive operation.
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2022 Lakr Aream. Copyright © 2026 mizorewww and Rayon contributors."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: RayonModule
      - package: RayonTerminal
      - package: RayonEditor
      - package: MachineStatus
      - package: MachineStatusView
      - package: SymbolPicker
schemes:
  mRayon:
    build:
      targets:
        mRayon: all
    run:
      config: Debug
    archive:
      config: Release
  Rayon:
    build:
      targets:
        Rayon: all
    run:
      config: Debug
    archive:
      config: Release
