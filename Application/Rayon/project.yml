# Rayon: one SwiftUI target for macOS and iOS (iPhone and iPad).
# Regenerate the project with: xcodegen generate
name: Rayon
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  RayonModule: { path: ../../Foundation/RayonModule }
  RayonTerminal: { path: ../../Foundation/RayonTerminal }
  RayonEditor: { path: ../../Foundation/RayonEditor }
  MachineStatus: { path: ../../Foundation/MachineStatus }
  MachineStatusView: { path: ../../Foundation/MachineStatusView }
  AlertController: { url: https://github.com/Lakr233/AlertController, from: 3.0.0 }
  SPIndicator: { url: https://github.com/ivanvorobei/SPIndicator, from: 1.6.5 }
  SymbolPicker: { url: https://github.com/xnth97/SymbolPicker, from: 1.6.2 }
configFiles:
  Debug: ../../Configuration/Debug.xcconfig
  Release: ../../Configuration/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Rayon:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      # Every source builds for both platforms; a file for one of them is
      # named Type+macOS.swift or Type+iOS.swift and guarded by #if os(...).
      - Application
      - Extension
      - Interface
      - PlatformSupport
      - path: Resources
        excludes:
          - InfoPlist
          - Entitlements
      - path: ../../Resources/EULA
        buildPhase: resources
      - path: ../../Resources/LICENSE
        buildPhase: resources
      - path: ../../Resources/Privacy
        type: folder
        buildPhase: resources
      - path: ../../Resources/Rayon.icon
        buildPhase: resources
        type: folder.iconcomposer
    settings:
      base:
        PRODUCT_NAME: Rayon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Rayon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/Entitlements-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Resources/Entitlements/Entitlements-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/InfoPlist/Info-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": Resources/InfoPlist/Info-macOS.plist
        INFOPLIST_KEY_CFBundleDisplayName: Rayon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2022 Lakr Aream. Copyright © 2026 mizorewww and Rayon contributors."
        # iOS only.
        "INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace[sdk=iphone*]": YES
        "INFOPLIST_KEY_NSFaceIDUsageDescription[sdk=iphone*]": We are using Face ID to check your ownership of your devices before performing sensitive operation.
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportsDocumentBrowser[sdk=iphone*]": YES
        SWIFT_EMIT_LOC_STRINGS: YES
    postCompileScripts:
      - name: Record Git Commit
        basedOnDependencyAnalysis: false
        script: |
          commit="$(git -C "$SRCROOT" rev-parse --short=10 HEAD 2>/dev/null || echo unknown)"
          if [ "$commit" != unknown ] && ! git -C "$SRCROOT" diff --quiet HEAD -- 2>/dev/null; then
            commit="$commit-dirty"
          fi
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          rm -f "$out"
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $commit" "$out" >/dev/null
    dependencies:
      - package: RayonModule
      - package: RayonTerminal
      - package: RayonEditor
      - package: MachineStatus
      - package: MachineStatusView
      - package: SymbolPicker
      - package: AlertController
      # Toasts; the Mac shows none.
      - package: SPIndicator
        destinationFilters: [iOS]
schemes:
  Rayon:
    build:
      targets:
        Rayon: all
    run:
      config: Debug
    archive:
      config: Release
