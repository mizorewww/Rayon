name: CI

# Builds both apps and runs the Swift package tests. pr-merge.yml merges a
# pull request the automated review approved only once this has passed on its
# head (CI_WORKFLOWS there and in pr-review.yml names this workflow).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The xcode-27 image, like release.yml: `swift test` with Xcode 26's SwiftPM
# uses its native build system, which leaves the code editor's asset catalog
# (CodeEditSymbols' Symbols.xcassets) unbuilt, so that package has no
# Bundle.module and does not compile. Xcode 27's SwiftPM builds with Swift
# Build, as Xcode does.
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          xcodebuild -version
      # No certificate on the runner: the Mac app is signed ad hoc, the iOS
      # app built for the simulator unsigned.
      - run: make build-${{ matrix.platform }}
      # Keys missing from a catalog, untranslated keys and format mismatches;
      # stale keys need both platforms' builds, so they are left to sync.
      - run: make check-localization

  test:
    name: Test
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          xcodebuild -version
      - run: make test
      - run: make scan-license
